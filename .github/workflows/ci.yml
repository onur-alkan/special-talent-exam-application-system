name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\OzelYetenekSinavSistemi.sln

      - name: Build (Release)
        run: dotnet build .\OzelYetenekSinavSistemi.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test .\OzelYetenekSinavSistemi.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Vulnerable package scan
        run: |
          dotnet list .\OzelYetenekSinavSistemi.sln package --vulnerable --include-transitive
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: ignore
